name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install "python-flint==0.9.0" matplotlib pytest z3-solver "scipy==1.18.0" "mpmath==1.3.0"
      - name: Run regression suite
        run: python -m pytest msaf -q -m "not slow"

  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: lake update
      - name: Fetch prebuilt Mathlib oleans
        run: lake exe cache get
      - name: Build kernel
        run: lake build
      # This is the real per-declaration axiom audit the static gate cannot
      # perform. It runs after `lake build`, reuses the oleans, and fails if
      # any of the 83 kernel declarations depends on more than the three
      # standard Lean axioms. lean/spec/ is out of scope by design.
      - name: Audit kernel declarations -- standard axioms only
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check pytest python-flint
          python -m pytest msaf/tests/test_lean_axiom_audit.py::test_every_declaration_uses_standard_axioms_only -q
      # lean/spec_v2/XiAnalyticSpecV2.lean is the repaired abstract spec.
      # It is still conditional (eight axioms, opaque zeta/gamma), so it is
      # NOT part of the kernel axiom audit above; this step compiles it and
      # proves that the historical endpoint contradiction no longer goes
      # through. lean/spec/ stays untouched and frozen.
      - name: Compile repaired spec V2 (conditional, out of kernel scope)
        working-directory: .
        run: python -m pytest msaf/tests/test_xi_spec_v2.py -q
      # lean/spec/ holds the CONDITIONAL specification (XiAnalyticSpec.lean):
      # nine declared axioms -- two opaque analytic symbols plus the seven
      # obligation lines -- that the pinned Mathlib cannot discharge. The
      # Python 0-axiom audit already exempts the same glob by design
      # (msaf/tests/test_lean_axiom_audit.py, "OUT OF SCOPE, and named rather
      # than forgotten"). The kernel glob must stay at zero hits; the spec
      # glob may not grow past the frozen budget without a deliberate edit
      # here.
      #
      # spec_v3--spec_v6 are certified packages with dedicated guards and
      # workflows (test_xi_spec_v3/v4/v5/v6.py) that scan after stripping
      # comments. The raw grep below would otherwise flag prose such as
      # "no `sorry`" in their docstrings; the exclusion is textual scope only,
      # not a weakening of the kernel sensor for lean/*.lean.
      - name: Escape-token sensor -- kernel (must be zero hits)
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b|\bunsafe\b|^axiom\b' \
              --include='*.lean' --exclude-dir=.lake --exclude-dir=spec \
              --exclude-dir=spec_v2 --exclude-dir=spec_v3 \
              --exclude-dir=spec_v4 --exclude-dir=spec_v5 \
              --exclude-dir=spec_v6 .
      - name: Escape-token sensor -- spec (placeholders banned; axiom budget frozen)
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b|\bunsafe\b' --include='*.lean' spec
          echo "declared axioms in spec/:"
          grep -rnE '^axiom\b' --include='*.lean' spec || true
          n=$(grep -rhE '^axiom\b' --include='*.lean' spec | wc -l)
          echo "spec/ axiom budget: $n / 9 (historical A-2026-0015; see lean/spec_v2/)"
          test "$n" -eq 9
      - name: Escape-token sensor -- spec_v2 (placeholders banned; 8-axiom budget)
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b|\bunsafe\b' --include='*.lean' spec_v2
          echo "declared axioms in spec_v2/:"
          grep -rnE '^axiom\b' --include='*.lean' spec_v2 || true
          n=$(grep -rhE '^axiom\b' --include='*.lean' spec_v2 | wc -l)
          echo "spec_v2 axiom budget: $n / 8 (repaired abstract spec)"
          test "$n" -eq 8

  # The Coq bridge packages 7-9 (A-2026-0012..A-2026-0014) were only guarded
  # statically by python-tests; this job actually compiles and re-checks them
  # with the pinned Coq 8.20.1 toolchain. Scope: f_k only, four stdlib axioms,
  # no general f, no real exponent, no periodic-box [J]. Docker keeps the
  # toolchain version pinned instead of relying on the runner's apt Coq.
  coq-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Coq toolchain version
        run: docker run --rm coqorg/coq:8.20.1@sha256:18ebf3da56e60e3ddfd7d4e51f4c53d10241a129f34e93dacbc71562dd43c57a coqc --version
      - name: Paket 8 -- conditional L5 limit step
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work/formal_bridge \
            coqorg/coq:8.20.1@sha256:18ebf3da56e60e3ddfd7d4e51f4c53d10241a129f34e93dacbc71562dd43c57a \
            bash check_integral_limit.sh
      - name: Paket 9 -- unconditional L5 for f_k
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work/formal_bridge \
            coqorg/coq:8.20.1@sha256:18ebf3da56e60e3ddfd7d4e51f4c53d10241a129f34e93dacbc71562dd43c57a \
            bash check_integral_infinite.sh

name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install "python-flint==0.9.0" matplotlib pytest z3-solver
      - name: Run regression suite
        run: python -m pytest msaf -q

  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: lake update
      - name: Fetch prebuilt Mathlib oleans
        run: lake exe cache get
      - name: Build kernel
        run: lake build
      - name: Escape-token sensor (must be zero hits)
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b|\bunsafe\b|^axiom\b' --include='*.lean' --exclude-dir=.lake .

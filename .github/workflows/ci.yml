name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install "python-flint==0.9.0" matplotlib pytest z3-solver "scipy==1.18.0" "mpmath==1.3.0"
      - name: Run regression suite
        run: python -m pytest msaf -q

  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: lake update
      - name: Fetch prebuilt Mathlib oleans
        run: lake exe cache get
      - name: Build kernel
        run: lake build
      # lean/spec/ holds the CONDITIONAL specification (XiAnalyticSpec.lean):
      # nine declared axioms -- two opaque analytic symbols plus the seven
      # obligation lines -- that the pinned Mathlib cannot discharge. The
      # Python 0-axiom audit already exempts the same glob by design
      # (msaf/tests/test_lean_axiom_audit.py, "OUT OF SCOPE, and named rather
      # than forgotten"). The kernel glob must stay at zero hits; the spec
      # glob may not grow past the frozen budget without a deliberate edit
      # here.
      - name: Escape-token sensor -- kernel (must be zero hits)
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b|\bunsafe\b|^axiom\b' --include='*.lean' --exclude-dir=.lake --exclude-dir=spec .
      - name: Escape-token sensor -- spec (placeholders banned; axiom budget frozen)
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b|\bunsafe\b' --include='*.lean' spec
          echo "declared axioms in spec/:"
          grep -rnE '^axiom\b' --include='*.lean' spec || true
          n=$(grep -rhE '^axiom\b' --include='*.lean' spec | wc -l)
          echo "spec/ axiom budget: $n / 9 (edit this step deliberately to move it)"
          test "$n" -eq 9

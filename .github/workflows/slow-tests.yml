name: Slow tests

# Full figure-eight Arb campaigns (r5 + r6) take tens of minutes to hours and
# cannot fit the 60-minute default `python-tests` job. They are excluded from
# CI by `-m "not slow"` and re-run here on a schedule and on demand.
#
# Scope note: a green CI run means the FAST suite passed. r5/r6 campaigns are
# only proven green by this workflow; do not cite CI as proof of them.

on:
  schedule:
    # 02:00 WIB (18:00 UTC on the previous day)
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  slow-campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install "python-flint==0.9.0" matplotlib pytest z3-solver "scipy==1.18.0" "mpmath==1.3.0"
      - name: Verify sealed receipts
        run: python -m pytest msaf/tests/test_fence_registry.py -q
      - name: Run slow regression suite
        run: python -m pytest msaf -q -m slow

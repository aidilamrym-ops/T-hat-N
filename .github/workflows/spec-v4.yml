name: Spec V4

# V4 discharges the midpoint sign hmid unconditionally from Mathlib's
# completedRiemannZeta (kernel-checked; no project axiom).  It is
# deliberately kept out of ci.yml so that the frozen A-2026-0016
# certificate for ci.yml stays byte-identical.  This workflow owns only the
# V4 source and its guard.
on:
  push:
    paths:
      - "lean/spec_v4/**"
      - "msaf/tests/test_xi_spec_v4.py"
      - ".github/workflows/spec-v4.yml"
  pull_request:
    paths:
      - "lean/spec_v4/**"
      - "msaf/tests/test_xi_spec_v4.py"
      - ".github/workflows/spec-v4.yml"

jobs:
  lean-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: lake update
      - name: Fetch prebuilt Mathlib oleans
        run: lake exe cache get
      - name: Build Mathlib kernel
        run: lake build
      - name: Compile unconditional spec V4 and audit its axiom footprint
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest msaf/tests/test_xi_spec_v4.py -q

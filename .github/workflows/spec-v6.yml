name: Spec V6

# V6 proves the certified finite-lattice bridge to completedCosZeta (1/2):
# T1 tail bound, T2 explicit Mellin error, T3 sign transfer, K1 one-term
# certificate.  It imports the sealed V4 source read-only, so the workflow
# materialises the V4 olean before running the guard.  Kept out of ci.yml so
# the frozen A-2026-0016 certificate stays byte-identical.
on:
  push:
    paths:
      - "lean/spec_v6/**"
      - "msaf/tests/test_xi_spec_v6.py"
      - ".github/workflows/spec-v6.yml"
  pull_request:
    paths:
      - "lean/spec_v6/**"
      - "msaf/tests/test_xi_spec_v6.py"
      - ".github/workflows/spec-v6.yml"

jobs:
  lean-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: lake update
      - name: Fetch prebuilt Mathlib oleans
        run: lake exe cache get
      - name: Build Mathlib kernel
        run: lake build
      - name: Build read-only V4 olean for the V6 import
        run: |
          mkdir -p .lake/build/lib/lean/spec_v4
          lake env lean -o .lake/build/lib/lean/spec_v4/XiUnconditional.olean \
            spec_v4/XiUnconditional.lean
      - name: Compile V6 and audit its axiom footprint
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest msaf/tests/test_xi_spec_v6.py -q

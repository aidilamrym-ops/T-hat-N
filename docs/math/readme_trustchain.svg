<text x="932.0" y="93.0" font-size="10.5" fill="#475569" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">release tag · pinned</text>
<rect x="20" y="162" width="1060" height="126" rx="9" fill="#ffffff" stroke="#d9e0ec"/>
<text x="34" y="186" font-size="13" font-weight="600" fill="#101828" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Why a number cannot be silently edited</text>
<text x="34" y="208.0" font-size="11.5" fill="#475569" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">1. The sealed block in this section is parsed from the artefacts at build time; hand-editing README.md breaks it against the generator (CI red).</text>
<text x="34" y="227.0" font-size="11.5" fill="#475569" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">2. Editing an artefact changes its LF-normalised sha256, which no longer matches the hash pinned in this block (CI red on the drift tests).</text>
<text x="34" y="246.0" font-size="11.5" fill="#475569" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">3. The test suite re-verifies the artefacts themselves (engine-B artifact guard, dashboard guard, amendment-floor tests) on every commit.</text>
<text x="34" y="265.0" font-size="11.5" fill="#475569" style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">4. The interval instrument is hashed before and after the engine-B run; both hashes must be equal (sha256 072910f2…).</text>
</svg>